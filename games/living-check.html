<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ด่านตรวจสิ่งมีชีวิต</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8F6F3; --card:#FFFFFF; --ink:#1F3B3A; --muted:#6B8583; --line:#CFE5E1;
  --brand:#14A098; --brand2:#0B7A73; --accent:#FF8A5B; --accent2:#D9622F;
  --good:#2E9E6A; --bad:#D94848; --warn:#F2B134; --violet:#6C63FF;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Sarabun',system-ui,sans-serif;color:var(--ink);min-height:100vh;background:var(--bg);-webkit-tap-highlight-color:transparent}
#labbg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.8}
#labbg svg{width:100%;height:100%}
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:12px 14px 30px}
h1,h2,h3,.title{font-family:'Mitr',sans-serif;font-weight:600}
.title{font-size:34px;margin:6px 0 0;color:var(--brand2);text-shadow:0 2px 0 #fff}
.subtitle{color:var(--muted);margin:2px 0 12px;text-shadow:0 0 4px #fff,0 0 8px #fff}
.btn{border:0;border-radius:14px;padding:10px 16px;font:600 16px 'Sarabun',sans-serif;cursor:pointer;background:var(--brand);color:#fff;box-shadow:0 4px 0 var(--brand2);transition:transform .08s;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand2)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:1px solid var(--line)}
.btn.orange{background:var(--accent);box-shadow:0 4px 0 var(--accent2)}
.btn.green{background:var(--good);box-shadow:0 4px 0 #1F7550}
.btn.red{background:var(--bad);box-shadow:0 4px 0 #9E2F2F}
.btn:disabled{opacity:.45;cursor:not-allowed}
.backlink{display:inline-block;text-decoration:none}
.card{background:rgba(255,255,255,.94);border-radius:20px;border:1px solid var(--line);padding:16px;box-shadow:0 6px 18px rgba(20,90,85,.10);backdrop-filter:blur(4px)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:15px;white-space:nowrap}
.pill.hot{background:#FFE7DA;border-color:#FFC7AE}
.muted{color:var(--muted)}
.legend{font-size:13px;color:var(--muted)}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.lvcard{position:relative;border-radius:20px;padding:14px;background:#fff;border:2px solid var(--line);cursor:pointer;text-align:center;transition:transform .15s}
.lvcard:hover{transform:translateY(-3px)}
.lvcard.locked{filter:grayscale(1);opacity:.6;cursor:not-allowed}
.lvcard .art{height:90px;display:flex;align-items:center;justify-content:center}
.lvcard .art svg{height:90px;width:auto}
.lvcard h3{margin:6px 0 2px;font-size:17px}
.lvcard p{margin:0;font-size:14px;color:var(--muted);min-height:40px}
.lvcard .st{font-size:22px;letter-spacing:2px;margin-top:4px}
.lock{position:absolute;top:8px;right:10px;font-size:20px}

/* mascot + bubble */
svg.bot{width:74px;height:74px;flex:none}
.result svg.bot{width:96px;height:96px;animation:float 3s ease-in-out infinite}
.guide{display:flex;gap:10px;align-items:flex-end}
.guide svg.bot{width:74px;height:74px;flex:none;animation:float 3s ease-in-out infinite}
.bubble{position:relative;background:#fff;border:2px solid var(--brand);border-radius:16px;padding:8px 12px;font-size:15px;max-width:620px}
.bubble:before{content:"";position:absolute;left:-10px;bottom:14px;border:8px solid transparent;border-right-color:var(--brand)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,90%,100%{opacity:1}95%{opacity:.2}}
.bulb{animation:blink 2.2s infinite}

/* HUD */
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.hearts{font-size:20px;letter-spacing:2px}

/* Level 1 */
.l1{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:14px;align-items:start}
.evid{perspective:900px}
.evcard{border-radius:22px;padding:18px;min-height:230px;background:linear-gradient(160deg,#FFFFFF,#F1FBF9);border:3px solid var(--brand);box-shadow:0 10px 24px rgba(20,90,85,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:flipIn .5s ease}
.evcard .em{font-size:64px;line-height:1.1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.12))}
.evcard .tx{font-family:'Mitr';font-size:20px;margin-top:10px}
.evcard .cnt{font-size:13px;color:var(--muted);margin-top:10px}
@keyframes flipIn{from{transform:rotateY(90deg);opacity:.2}to{transform:rotateY(0);opacity:1}}
.bins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bin{border-radius:18px;background:#fff;border:2px solid var(--line);padding:10px 8px;text-align:center;cursor:pointer;transition:transform .1s, border-color .2s;touch-action:manipulation}
.bin:hover{border-color:var(--brand)}
.bin svg{width:54px;height:54px}
.bin .nm{font-family:'Mitr';font-size:14.5px;line-height:1.25;margin-top:4px}
.bin .ct{font-size:12px;color:var(--muted)}
.bin.ok{animation:pop .45s;border-color:var(--good);background:#E6F7EE}
.bin.no{animation:shake .45s;border-color:var(--bad);background:#FDECEC}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* Level 2 */
.l2{display:grid;grid-template-columns:200px 1fr 300px;gap:12px;align-items:start}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jar{position:relative;border-radius:16px;background:#fff;border:2px solid var(--line);padding:6px;text-align:center;cursor:pointer;font-size:13px}
.jar svg{width:100%;height:64px}
.jar.sel{border-color:var(--brand);box-shadow:0 0 0 3px rgba(20,160,152,.25)}
.jar.done{opacity:.75}
.jar .mini{position:absolute;top:2px;right:4px;font-size:16px}
.bench{text-align:center}
.bench .spec{height:190px;display:flex;align-items:center;justify-content:center;position:relative}
.bench .spec svg.big{height:180px;width:auto;filter:drop-shadow(0 8px 6px rgba(0,0,0,.15))}
.scanline{position:absolute;left:10%;right:10%;height:4px;background:linear-gradient(90deg,transparent,#3EF0E2,transparent);box-shadow:0 0 14px #3EF0E2;animation:scan 1.1s ease-in-out 1;top:0;opacity:0}
@keyframes scan{0%{top:5%;opacity:1}100%{top:95%;opacity:0}}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.tool{border-radius:16px;background:#fff;border:2px solid var(--line);padding:8px 4px;cursor:pointer;font-size:13px;text-align:center;touch-action:manipulation}
.tool svg{width:44px;height:44px}
.tool.used{background:#EEF5F4;opacity:.6;cursor:default}
.viewer{min-height:200px;border-radius:18px;background:#0E2A33;color:#D7FFFB;padding:10px;position:relative;overflow:hidden}
.viewer .vt{font-family:'Mitr';font-size:14px;color:#7FF5EA;margin-bottom:6px}
.viewer svg{display:block;margin:0 auto}
.viewer .res{font-size:14px;margin-top:6px;color:#E8FFFD}
.frames{display:flex;justify-content:center;gap:16px;align-items:center}
.frames .fr{background:#163B46;border-radius:12px;padding:6px;text-align:center;font-size:12px}
.frames .arrow{font-size:26px;color:#7FF5EA}
.fr2{animation:fadeIn 1.2s ease .5s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.chartline{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.log{font-size:14px;max-height:170px;overflow:auto}
.log div{padding:5px 8px;border-radius:10px;background:#F2FAF8;margin:4px 0}
.verdict{display:flex;gap:8px;margin-top:10px}
.verdict .btn{flex:1;font-size:17px}
.stamp{position:absolute;font-family:'Mitr';font-weight:600;font-size:26px;padding:4px 14px;border:5px solid;border-radius:12px;transform:rotate(-14deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1);background:rgba(255,255,255,.85)}
.stamp.alive{color:var(--good);border-color:var(--good)}
.stamp.dead{color:#7A4E9E;border-color:#7A4E9E}
@keyframes stamp{from{transform:scale(3) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(-14deg);opacity:1}}

/* Level 3 */
.l3{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}
.casefile{border-radius:22px;background:linear-gradient(#FFF3D6,#FDE6B6);border:2px solid #E7C27B;padding:14px;position:relative;text-align:center}
.casefile .tab{position:absolute;top:-14px;left:18px;background:#FDE6B6;border:2px solid #E7C27B;border-bottom:none;border-radius:10px 10px 0 0;padding:2px 14px;font-family:'Mitr';font-size:14px}
.casefile svg.big{height:190px;width:auto}
.clues{display:flex;flex-direction:column;gap:8px}
.clue{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 12px;animation:slideIn .45s ease both;font-size:16px}
.clue .ic{font-size:26px}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.choices{display:grid;gap:8px;margin-top:10px}
.choice{text-align:left;border-radius:14px;border:2px solid var(--line);background:#fff;padding:10px 14px;font:16px 'Sarabun';cursor:pointer;touch-action:manipulation}
.choice:hover{border-color:var(--brand)}
.choice.ok{border-color:var(--good);background:#E6F7EE}
.choice.no{border-color:var(--bad);background:#FDECEC}
.timer{font-family:'Mitr';font-size:18px}
.timer.low{color:var(--bad);animation:pop 1s infinite}

/* Level 4 */
.l4{display:grid;grid-template-columns:1fr 280px 1fr;gap:12px;align-items:start}
.side{border-radius:20px;padding:10px;min-height:260px;border:3px dashed}
.side.yes{border-color:#7CCB9E;background:rgba(230,247,238,.85)}
.side.nono{border-color:#B9A2D6;background:rgba(241,234,250,.85)}
.side h3{margin:2px 0 8px;font-size:17px;text-align:center}
.side .chip{background:#fff;border-radius:12px;padding:7px 10px;margin:6px 0;font-size:14px;border:1px solid var(--line);animation:pop .4s}
.side .chip label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.side .chip input{width:20px;height:20px;margin-top:1px;flex:none}
.center{text-align:center}
.center svg.big{height:170px;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* notebook */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-height:60vh;overflow:auto}
.entry{border-radius:16px;border:2px solid var(--line);padding:8px;text-align:center;background:#fff;cursor:pointer}
.entry svg{height:70px;width:auto}
.entry.locked{background:#F2F6F5;color:var(--muted);cursor:default}
.entry.locked svg{filter:brightness(0) opacity(.18)}
.entry .tag{font-size:12px;border-radius:999px;padding:1px 8px;display:inline-block;margin-top:2px}
.tag.alive{background:#DDF4E7;color:#1F7550}
.tag.dead{background:#ECE3F6;color:#5D3B80}
.tag.debate{background:#FFF0D1;color:#8A5A00}
.ptable{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0}
.ptable td{padding:5px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
.ptable td.mk{width:34px;text-align:center;font-size:18px}
.ptable td.ic svg{width:28px;height:28px}

/* modal/toast/result */
#modal{position:fixed;inset:0;background:rgba(10,40,40,.5);display:none;align-items:center;justify-content:center;z-index:900;padding:14px}
#modal.show{display:flex}
#modalBody{max-width:720px;width:100%;max-height:92vh;overflow:auto;animation:pop .3s}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:950;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(94vw,620px)}
.t{color:#fff;padding:9px 16px;border-radius:12px;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.2);text-align:center;animation:fadeIn .2s}
.t.good{background:var(--good)} .t.bad{background:var(--bad)} .t.info{background:#2F4B5A}
.result{text-align:center}
.bigstars{font-size:54px;letter-spacing:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;text-align:left;max-width:440px;margin:12px auto}
.stats div:nth-child(odd){color:var(--muted)}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:999;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* responsive (landscape phones) */
@media (max-width:980px){
  .l2{grid-template-columns:150px 1fr 240px}
  .levels{grid-template-columns:repeat(2,1fr)}
  .verdict .btn{font-size:15px;padding:10px 8px;white-space:nowrap}
}
@media (max-height:520px){
  .title{font-size:26px}
  .bench .spec{height:130px} .bench .spec svg.big{height:120px}
  .casefile svg.big{height:120px}
  .evcard{min-height:170px} .evcard .em{font-size:48px}
  .viewer{min-height:160px}
  .guide svg.bot{width:56px;height:56px}
  .lvcard .art{height:66px} .lvcard .art svg{height:66px}
}
@media (max-width:700px){
  .l1,.l2,.l3,.l4{grid-template-columns:1fr}
  .shelf{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div id="labbg"></div>
<div id="app"></div>
<div id="toast"></div>
<div id="modal"><div class="card" id="modalBody"></div></div>

<script>
/* ===================== ตั้งค่า ===================== */
const SUBJECT = 'ชีวะคือชีวิต';
const CLASS_NAME = 'ม.3';
const STORE_KEY = 'livingCheck_v1';
const L3_SECONDS = 240;
const L2_BUDGET = 15;

/* ===================== ข้อมูล: สมบัติของสิ่งมีชีวิต ===================== */
const PROPS = {
  cell:   {name:'ประกอบด้วยเซลล์และมีการจัดระบบ', short:'เซลล์และการจัดระบบ', desc:'สิ่งมีชีวิตทุกชนิดประกอบด้วยเซลล์ ตั้งแต่ 1 เซลล์ไปจนถึงหลายเซลล์ที่จัดระบบเป็นเนื้อเยื่อ อวัยวะ และระบบอวัยวะ'},
  energy: {name:'ต้องการสารอาหารและพลังงาน', short:'สารอาหารและพลังงาน', desc:'มีเมแทบอลิซึม คือกระบวนการเคมีในเซลล์ เช่น การสังเคราะห์ด้วยแสง การหายใจระดับเซลล์ เพื่อสร้างและใช้พลังงาน'},
  growth: {name:'เจริญเติบโตและมีอายุขัย', short:'เจริญเติบโต อายุขัย', desc:'เพิ่มจำนวนเซลล์และขนาด มีการเปลี่ยนแปลงตามวัยจนตัวเต็มวัย และมีอายุขัยจำกัด'},
  repro:  {name:'สืบพันธุ์ได้', short:'สืบพันธุ์', desc:'สร้างสิ่งมีชีวิตรุ่นใหม่ได้ทั้งแบบอาศัยเพศและไม่อาศัยเพศ ทำให้สปีชีส์ดำรงอยู่ได้'},
  respond:{name:'ตอบสนองต่อสิ่งเร้า', short:'ตอบสนองสิ่งเร้า', desc:'รับรู้การเปลี่ยนแปลงของสิ่งแวดล้อม เช่น แสง เสียง การสัมผัส สารเคมี แล้วตอบสนอง'},
  homeo:  {name:'รักษาดุลยภาพของร่างกาย', short:'รักษาดุลยภาพ', desc:'ควบคุมสภาพภายในให้ค่อนข้างคงที่ เช่น อุณหภูมิร่างกาย น้ำ ระดับน้ำตาลในเลือด'},
  evolve: {name:'ถ่ายทอดลักษณะทางพันธุกรรมและวิวัฒนาการ', short:'พันธุกรรม วิวัฒนาการ', desc:'มีสารพันธุกรรมถ่ายทอดลักษณะสู่รุ่นลูก และประชากรเปลี่ยนแปลงหรือปรับตัวได้เมื่อเวลาผ่านไป'},
};
const PORDER = ['cell','energy','growth','repro','respond','homeo','evolve'];

/* หลักฐานด่าน 1 */
const EVID = [
  ['🌿','ไมยราบหุบใบทันทีเมื่อถูกสัมผัส','respond'],
  ['👁️','รูม่านตาหดเล็กลงเมื่อเจอแสงจ้า','respond'],
  ['🌱','ต้นถั่วงอกโค้งเข้าหาแสงจากหน้าต่าง','respond'],
  ['🦗','จิ้งหรีดหยุดร้องเมื่อได้ยินเสียงคนเดินมา','respond'],
  ['💦','เหงื่อออกเมื่ออากาศร้อน ช่วยลดอุณหภูมิร่างกาย','homeo'],
  ['🐟','ปลาน้ำจืดขับปัสสาวะเจือจางปริมาณมาก เพื่อกำจัดน้ำส่วนเกิน','homeo'],
  ['🩸','ฮอร์โมนอินซูลินช่วยลดระดับน้ำตาลในเลือดหลังกินข้าว','homeo'],
  ['🥶','ร่างกายสั่นเมื่อหนาว เพื่อสร้างความร้อนให้อุณหภูมิกายคงที่','homeo'],
  ['🦠','อะมีบาแบ่งเซลล์จาก 1 เซลล์เป็น 2 เซลล์','repro'],
  ['🍞','ยีสต์แตกหน่อเกิดเป็นเซลล์ใหม่','repro'],
  ['🌿','เฟิร์นสร้างสปอร์ใต้ใบ แล้วงอกเป็นต้นใหม่','repro'],
  ['🐣','ลูกไก่ฟักออกจากไข่ แล้วโตเป็นไก่ตัวเต็มวัย','growth'],
  ['🐸','ลูกอ๊อดเปลี่ยนแปลงรูปร่างจนกลายเป็นกบ','growth'],
  ['🌾','ต้นข้าวออกรวง แล้วเหี่ยวตายเมื่อครบอายุ','growth'],
  ['☀️','ใบไม้สังเคราะห์ด้วยแสงสร้างน้ำตาลกลูโคส','energy'],
  ['⚡','เซลล์สลายกลูโคสในการหายใจระดับเซลล์ ได้พลังงาน ATP','energy'],
  ['🐇','กระต่ายกินหญ้าเพื่อนำสารอาหารไปใช้','energy'],
  ['🫀','เนื้อเยื่อหลายชนิดรวมกันเป็นหัวใจ และทำงานร่วมกันในระบบหมุนเวียนเลือด','cell'],
  ['🔬','ส่องใบสาหร่ายหางกระรอกเห็นเซลล์เรียงต่อกัน','cell'],
  ['🧫','แบคทีเรียมีเพียง 1 เซลล์ แต่ดำรงชีวิตได้ครบ','cell'],

function startLevel(l){
  stopTimer(); closeModal();
  G={level:l,hearts:3,score:0,stats:{correct:0,wrong:0},newUnlocks:[],ended:false};
  ({1:startL1,2:startL2,3:startL3,4:startL4})[l]();
}
function hud(extra=''){
  return `<div class="hud"><button class="btn ghost" id="quit">✕ ออก</button><b style="font-family:Mitr;font-size:18px">${LEVELS[G.level].title}</b><div class="spacer"></div>

}
function bindQuit(){ $('#quit').onclick=()=>{ if(confirm('ออกจากด่านนี้? คะแนนรอบนี้จะไม่ถูกบันทึก')) showHome(); }; }
function refreshHud(){ const h=$('#hearts'); if(h) h.textContent=hearts(); const s=$('#score'); if(s) s.textContent=G.score; }
function loseHeart(){ G.hearts--; G.stats.wrong++; refreshHud(); if(G.hearts<=0){ setTimeout(()=>endLevel(false,'หัวใจหมด'),900); return true; } return false; }

/* ===================== ด่าน 1 ===================== */
function startL1(){
  G.deck=shuffle(EVID).slice(0,L1_COUNT); G.i=0; G.combo=0; G.counts={}; G.lock=false;
  unlockBook('props');
  app.innerHTML = hud(`<span class="pill" id="combo">🔥 คอมโบ 0</span>`)+`
    ${guide('อ่านการ์ดหลักฐาน แล้วแตะสมบัติของสิ่งมีชีวิตที่การ์ดนั้นแสดงให้เห็นชัดที่สุด','think')}
    <div class="l1" style="margin-top:12px"><div class="evid" id="evid"></div>
    <div class="bins">${PORDER.map(k=>`<div class="bin" data-k="${k}">${PICON[k]}<div class="nm">${PROPS[k].short}</div><div class="ct" id="ct-${k}">0 ใบ</div></div>`).join('')}</div></div>`;
  bindQuit(); renderCard();
  app.querySelectorAll('.bin').forEach(b=>b.onclick=()=>answerL1(b));
}
function renderCard(){
  const c=G.deck[G.i];
  $('#evid').innerHTML=`<div class="evcard"><div class="em">${c[0]}</div><div class="tx">${esc(c[1])}</div><div class="cnt">การ์ดใบที่ ${G.i+1} / ${G.deck.length}</div></div>`;
}
function answerL1(b){
  if(G.lock||G.ended) return;
  const c=G.deck[G.i], k=b.dataset.k;
  b.classList.remove('ok','no'); void b.offsetWidth;
  if(k===c[2]){
    G.combo++; G.stats.correct++; const pts=50+Math.min(G.combo-1,5)*10; G.score+=pts;
    G.counts[k]=(G.counts[k]||0)+1; $('#ct-'+k).textContent=G.counts[k]+' ใบ';
    b.classList.add('ok'); toast(`ถูกต้อง! +${pts}`,'good',1400);
  } else {
    G.combo=0; b.classList.add('no');
    const right=app.querySelector(`.bin[data-k="${c[2]}"]`); right.classList.remove('ok'); void right.offsetWidth; right.classList.add('ok');
    toast(`ยังไม่ใช่ ข้อนี้คือ "${PROPS[c[2]].name}"`,'bad',2600);
    if(loseHeart()) return;
  }
  $('#combo').textContent='🔥 คอมโบ '+G.combo; refreshHud();
  G.lock=true; const g=G;
  setTimeout(()=>{ if(G!==g||g.ended) return; G.lock=false; G.i++; if(G.i>=G.deck.length) endLevel(true); else renderCard(); }, k===c[2]?650:1500);
}

/* ===================== ด่าน 2 ===================== */

    ${guide('เลือกตัวอย่างจากชั้นวาง ใช้เครื่องมือตรวจ (มีพลังงานจำกัด ใช้อย่างคุ้มค่า!) แล้วประทับตราว่ามีชีวิตหรือไม่มีชีวิต','think')}
    <div class="l2" style="margin-top:12px">
      <div class="card" style="padding:10px"><b>ชั้นวางตัวอย่าง</b><div class="shelf" id="shelf"></div></div>

        <div class="verdict"><button class="btn green" id="vAlive" disabled>🟢 มีชีวิต</button><button class="btn red" id="vDead" disabled>⚪ ไม่มีชีวิต</button></div></div>
    </div>`;

function renderShelf(){
  $('#shelf').innerHTML=G.order.map((k,i)=>`<div class="jar ${G.sel===k?'sel':''} ${k in G.judged?'done':''}" data-k="${k}">
    ${k in G.judged?`<span class="mini">${G.judged[k]===SPEC[k].alive?'✅':'❌'}</span>`:''}${art(k).replace('class="big"','')}<div>${k in G.judged?SPEC[k].name:'ตัวอย่าง '+String.fromCharCode(65+i)}</div></div>`).join('');
  $('#shelf').querySelectorAll('.jar').forEach(j=>j.onclick=()=>selectSpec(j.dataset.k));
}
function selectSpec(k){
  G.sel=k; renderShelf();
  const i=G.order.indexOf(k), done=k in G.judged;
  $('#bench').innerHTML=`<div class="row"><b style="font-family:Mitr;font-size:18px">${done?SPEC[k].name:'ตัวอย่าง '+String.fromCharCode(65+i)}</b><div class="spacer"></div><span class="legend">${done?'ตรวจแล้ว':'ยังไม่ทราบชนิด — ดูจากหลักฐาน'}</span></div>
    <div class="spec" id="spec">${art(k)}${done?stampHTML(G.judged[k]):''}</div>
    <div class="tools">${Object.keys(TOOLS).map(t=>`<div class="tool ${G.used[k].includes(t)?'used':''}" data-t="${t}">${TICON[t]}<div>${TOOLS[t].name}</div></div>`).join('')}</div>
    <div class="viewer" id="viewer"><div class="vt">จอแสดงผล</div><div class="res" style="color:#9CC">แตะเครื่องมือเพื่อตรวจตัวอย่างนี้</div></div>`;
  $('#bench').querySelectorAll('.tool').forEach(t=>t.onclick=()=>useTool(t.dataset.t));
  renderLog(); const lock = done||G.ended;
  $('#vAlive').disabled=lock; $('#vDead').disabled=lock;
}
function stampHTML(alive){ return `<div class="stamp ${alive?'alive':'dead'}" style="top:30%;left:28%">${alive?'มีชีวิต':'ไม่มีชีวิต'}</div>`; }
function renderLog(){
  const k=G.sel, u=G.used[k];
  $('#log').innerHTML = u.length ? u.map(t=>`<div><b>${TOOLS[t].name}:</b> ${SPEC[k].tools[t]}</div>`).join('') : '<div class="muted">ยังไม่มีผล ลองใช้เครื่องมือก่อน</div>';
}
function useTool(t){
  const k=G.sel; if(G.ended) return;
  if(G.used[k].includes(t)){ showView(k,t); return; }
  if(k in G.judged){ toast('ตัวอย่างนี้ตรวจเสร็จแล้ว','info'); return; }
  if(G.budget<=0){ toast('พลังงานเครื่องมือหมดแล้ว ต้องตัดสินจากหลักฐานที่มี','bad'); return; }
  G.budget--; G.used[k].push(t); $('#budget').textContent='🔋 เครื่องมือ '+G.budget;
  const sp=$('#spec'); const sl=document.createElement('div'); sl.className='scanline'; sp.appendChild(sl); setTimeout(()=>sl.remove(),1200);
  $('#bench').querySelector(`.tool[data-t="${t}"]`).classList.add('used');
  showView(k,t); renderLog();
}
function showView(k,t){
  const r=SPEC[k].tools[t]; let vis='';
  if(t==='micro') vis=micro(k);
  else if(t==='inc') vis=incFrames(k);
  else if(t==='gas') vis=gasChart(k);
  else vis=`<div style="font-size:60px;text-align:center;animation:pop 1s infinite">${STIM_ICON[k]}</div>`;
  $('#viewer').innerHTML=`<div class="vt">${TOOLS[t].name}</div>${vis}<div class="res">${r}</div>`;
}
function judge(alive){
  const k=G.sel; if(k in G.judged||G.ended) return;
  if(!G.used[k].length && !confirm('ยังไม่ได้ใช้เครื่องมือตรวจตัวอย่างนี้เลย จะตัดสินเลยหรือไม่?')) return;
  G.judged[k]=alive; unlockBook(k);
  const ok = alive===SPEC[k].alive;
  $('#spec').insertAdjacentHTML('beforeend',stampHTML(alive));
  $('#vAlive').disabled=true; $('#vDead').disabled=true;
  if(ok){ G.score+=100; G.stats.correct++; refreshHud(); }
  const dead = ok?false:loseHeart();
  renderShelf(); const g=G;
  setTimeout(()=>{
    if(dead||G!==g||g.ended) return;
    openModal(`<div class="row"><div style="width:110px">${art(k)}</div><div>
      <h2 style="margin:0;color:${ok?'var(--good)':'var(--bad)'}">${ok?'✅ ถูกต้อง +100':'❌ ยังไม่ถูก'}</h2>
      <div style="font-family:Mitr;font-size:20px">${SPEC[k].name} · ${SPEC[k].alive?'มีชีวิต':'ไม่มีชีวิต'}</div></div></div>
      ${guide(SPEC[k].note, ok?'happy':'sad')}${propTable(SPEC[k].marks)}
      <div class="row" style="justify-content:flex-end"><button class="btn" id="mOk">ตกลง</button></div>`);
    $('#mOk').onclick=()=>{ closeModal(); const next=G.order.find(x=>!(x in G.judged)); if(next) selectSpec(next); else { G.score+=G.budget*15; endLevel(true); } };
  },700);
}

/* ===================== ด่าน 3 ===================== */
function startL3(){
  G.order=shuffle(L3_ORDER); G.i=0; G.timeLeft=L3_SECONDS; G.phase='verdict';
  app.innerHTML = hud(`<span class="pill timer" id="timer">⏱ 4:00</span>`)+`<div id="l3"></div>`;
  bindQuit(); renderCase();
  TIMER=setInterval(()=>{ G.timeLeft--; const t=$('#timer'); if(t){ t.textContent=`⏱ ${Math.floor(G.timeLeft/60)}:${String(G.timeLeft%60).padStart(2,'0')}`; t.classList.toggle('low',G.timeLeft<=30); }
    if(G.timeLeft<=0){ stopTimer(); endLevel(false,'หมดเวลา'); } },1000);
}
function renderCase(){
  const k=G.order[G.i], c=CASES[k]; G.phase='verdict';
  $('#l3').innerHTML=`${guide('อ่านหลักฐานทั้งหมดให้ครบก่อนตัดสิน เคสพวกนี้ชอบหลอกนะ!','think')}
    <div class="l3" style="margin-top:12px">
      <div class="casefile"><span class="tab">เคสที่ ${G.i+1}/${G.order.length}</span><div style="margin-top:8px">${art(k)}</div><div style="font-family:Mitr;font-size:22px">${c.name}</div></div>
      <div class="card"><div class="clues">${c.clues.map((x,i)=>`<div class="clue" style="animation-delay:${i*.35}s"><span class="ic">${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div>
        <div id="ask"><div class="verdict"><button class="btn green" id="vA">🟢 มีชีวิต</button><button class="btn red" id="vD">⚪ ไม่มีชีวิต</button></div></div></div>
    </div>`;
  $('#vA').onclick=()=>verdictL3(true); $('#vD').onclick=()=>verdictL3(false);
}
function verdictL3(alive){
  if(G.phase!=='verdict'||G.ended) return; G.phase='reason';
  const k=G.order[G.i], c=CASES[k], ok=alive===c.alive;
  if(ok){ G.score+=80; G.stats.correct++; refreshHud(); toast('ตัดสินถูก! +80 ต่อไปเลือกเหตุผล','good',1800); }
  else { toast(`ยังไม่ถูก ${c.name}${c.alive?'มีชีวิต':'ไม่มีชีวิต'} ลองหาเหตุผลดู`,'bad',2600); if(loseHeart()) return; }
  const opts=shuffle(c.reasons);
  $('#ask').innerHTML=`<p style="margin:12px 0 4px"><b>เหตุผลข้อใดอธิบายเคสนี้ได้ดีที่สุด?</b> ${ok?'':`<span class="muted">(${c.name}${c.alive?'มีชีวิต':'ไม่มีชีวิต'})</span>`}</p>
    <div class="choices">${opts.map((o,i)=>`<button class="choice" data-i="${i}">${esc(o[0])}</button>`).join('')}</div>`;
  $('#ask').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
    if(G.phase!=='reason'||G.ended) return; G.phase='done';
    const o=opts[+b.dataset.i];
    if(o[1]){ b.classList.add('ok'); G.score+=70; G.stats.correct++; refreshHud(); }
    else { b.classList.add('no'); $('#ask').querySelectorAll('.choice').forEach((x,i)=>{ if(opts[i][1]) x.classList.add('ok'); }); if(loseHeart()) return; }
    unlockBook(k); const g=G;
    setTimeout(()=>{
      if(G!==g||g.ended) return;
      $('#ask').insertAdjacentHTML('beforeend',`<div style="margin-top:10px">${guide(c.note,o[1]?'happy':'sad')}</div>
        <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" id="nx">${G.i+1<G.order.length?'เคสถัดไป ➡️':'สรุปผล 🏁'}</button></div>`);
      $('#nx').onclick=()=>{ G.i++; if(G.i>=G.order.length){ stopTimer(); G.score+=G.timeLeft; endLevel(true); } else renderCase(); };
    },500);
  });
}

/* ===================== ด่าน 4 ===================== */
function startL4(){
  G.cards=shuffle(VIRUS_EV); G.i=0; G.sorted={yes:[],no:[]}; G.phase='sort'; G.argOk=false; G.argTries=0;
  app.innerHTML = hud()+`${guide('นี่คือคดีที่นักวิทยาศาสตร์ยังถกเถียงกันอยู่! ก่อนอื่นช่วยคัดแยกหลักฐาน 8 ข้อ ว่าข้อไหนสนับสนุนว่าไวรัส "มีชีวิต" และข้อไหนสนับสนุนว่า "ไม่มีชีวิต"','think')}
    <div class="l4" style="margin-top:12px">
      <div class="side yes" id="sideYes"><h3>🟢 สนับสนุนว่ามีชีวิต</h3></div>
      <div class="card center"><div>${art('virus')}</div><div id="vcard"></div></div>
      <div class="side nono" id="sideNo"><h3>⚪ สนับสนุนว่าไม่มีชีวิต</h3></div>
    </div><div id="stage2"></div>`;
  bindQuit(); renderVcard();
}
function renderVcard(){
  const c=G.cards[G.i];
  $('#vcard').innerHTML=`<div class="evcard" style="min-height:140px;padding:12px"><div class="tx" style="font-size:17px;margin:0">${esc(c[0])}</div><div class="cnt">หลักฐาน ${G.i+1}/${G.cards.length}</div></div>
    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn green" id="toY">◀ มีชีวิต</button><button class="btn" style="background:#8A6BB8;box-shadow:0 4px 0 #5D3B80" id="toN">ไม่มีชีวิต ▶</button></div>`;
  $('#toY').onclick=()=>sortV('yes'); $('#toN').onclick=()=>sortV('no');
}
function sortV(side){
  if(G.phase!=='sort'||G.ended) return;
  const c=G.cards[G.i], ok=side===c[1];
  if(ok){ G.score+=40; G.stats.correct++; toast('ถูกต้อง +40','good',1200); }
  else { toast('หลักฐานข้อนี้อยู่อีกฝั่งนะ','bad',2000); if(loseHeart()) return; }
  G.sorted[c[1]].push(c[0]); refreshHud(); renderSides(false);
  G.i++; if(G.i<G.cards.length) renderVcard(); else stage2();
}
function renderSides(pick){
  const chip=(t,side)=>`<div class="chip">${pick?`<label><input type="checkbox" data-side="${side}" value="${esc(t)}"><span>${esc(t)}</span></label>`:esc(t)}</div>`;
  $('#sideYes').innerHTML='<h3>🟢 สนับสนุนว่ามีชีวิต</h3>'+G.sorted.yes.map(t=>chip(t,'yes')).join('');
  $('#sideNo').innerHTML='<h3>⚪ สนับสนุนว่าไม่มีชีวิต</h3>'+G.sorted.no.map(t=>chip(t,'no')).join('');
}
function stage2(){
  G.phase='argue'; unlockBook('virus'); renderSides(true);
  $('#vcard').innerHTML=`<p style="margin:6px 0"><b>คัดแยกครบแล้ว!</b></p>`;
  $('#stage2').innerHTML=`<div class="card" style="margin-top:12px">${guide('ทีนี้ถึงตาเธอสรุปจุดยืน เลือกจุดยืน 1 ข้อ แล้วติ๊กหลักฐาน 2 ข้อจากด้านบนที่สนับสนุนจุดยืนของเธอ (ถ้าเลือก "ก้ำกึ่ง" ให้เลือกฝั่งละ 1 ข้อ)','happy')}
    <div class="row" style="margin-top:10px" id="pos">
      <button class="btn ghost" data-p="yes">🟢 ไวรัสมีชีวิต</button><button class="btn ghost" data-p="mid">🟡 ก้ำกึ่ง</button><button class="btn ghost" data-p="no">⚪ ไวรัสไม่มีชีวิต</button>
      <div class="spacer"></div><button class="btn orange" id="submitArg">📝 ส่งข้อสรุป</button></div></div>`;
  G.pos=null;
  $('#pos').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ G.pos=b.dataset.p; $('#pos').querySelectorAll('[data-p]').forEach(x=>x.className='btn '+(x===b?'':'ghost')); });
  $('#submitArg').onclick=submitArg;
}
function submitArg(){
  if(G.ended) return;
  const sel=[...document.querySelectorAll('.side input:checked')].map(x=>x.dataset.side);
  if(!G.pos){ toast('เลือกจุดยืนก่อนนะ','info'); return; }
  if(sel.length!==2){ toast('ติ๊กหลักฐานให้ครบ 2 ข้อพอดี','info'); return; }
  const y=sel.filter(s=>s==='yes').length;
  const valid = (G.pos==='yes'&&y===2)||(G.pos==='no'&&y===0)||(G.pos==='mid'&&y===1);
  if(!valid){
    G.argTries++; G.score=Math.max(0,G.score-50); refreshHud();
    const hint = G.pos==='yes'?'จุดยืน "มีชีวิต" ต้องใช้หลักฐานฝั่งมีชีวิตทั้ง 2 ข้อ':G.pos==='no'?'จุดยืน "ไม่มีชีวิต" ต้องใช้หลักฐานฝั่งไม่มีชีวิตทั้ง 2 ข้อ':'จุดยืน "ก้ำกึ่ง" ต้องใช้หลักฐานฝั่งละ 1 ข้อ';
    toast('หลักฐานยังไม่สนับสนุนจุดยืน -50 · '+hint,'bad',3500); return;
  }
  G.argOk=true; G.score+=200; refreshHud();
  const posTh={yes:'ไวรัสมีชีวิต',no:'ไวรัสไม่มีชีวิต',mid:'ไวรัสก้ำกึ่งระหว่างมีชีวิตกับไม่มีชีวิต'}[G.pos];
  openModal(`<div class="row"><div style="width:110px">${art('virus')}</div><div><h2 style="margin:0;color:var(--good)">📝 ข้อสรุปมีเหตุผลรองรับ +200</h2><div>จุดยืนของเธอ: <b>${posTh}</b></div></div></div>
    ${guide(VIRUS.note,'happy')}${propTable(VIRUS.marks)}<div class="row" style="justify-content:flex-end"><button class="btn" id="mOk">สรุปผล 🏁</button></div>`);
  $('#mOk').onclick=()=>{ closeModal(); endLevel(true); };
}

/* ===================== จบด่าน ===================== */
function endLevel(passed,reason=''){
  if(G.ended) return; G.ended=true; stopTimer(); closeModal();
  const p=player(), l=G.level; let heartBonus=0, st=0;
  if(passed){
    heartBonus=50*G.hearts; G.score+=heartBonus;
    const lost=3-G.hearts;
    if(l===3) st = lost===0&&G.timeLeft>=60 ? 3 : lost<=1 ? 2 : 1;
    else if(l===4) st = lost===0&&G.argTries===0 ? 3 : lost<=1 ? 2 : 1;
    else st = lost===0 ? 3 : lost<=1 ? 2 : 1;
    const prev=p.levels[l]||{stars:0,score:0};
    p.levels[l]={stars:Math.max(prev.stars||0,st),score:Math.max(prev.score||0,G.score)};
    saveDB(); confetti(st*25);
  }
  const s=G.stats, acc=(s.correct+s.wrong)?Math.round(100*s.correct/(s.correct+s.wrong)):0;
  const now=new Date();
  const dateTh=now.toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric'})+' '+now.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  const extra = l===2 ? `<div>พลังงานเครื่องมือเหลือ</div><div>${G.budget} (+${G.budget*15})</div>` : l===3&&passed ? `<div>โบนัสเวลา</div><div>+${G.timeLeft}</div>` : '';
  const unlocks = G.newUnlocks.length ? `<p>📁 ปลดล็อกแฟ้มคดี: <b>${G.newUnlocks.map(k=>entryInfo(k).name).join(', ')}</b></p>` : '';
  const hasNext = passed && l<4 && isUnlocked(l+1);
  app.innerHTML=`
  <div class="card result" style="max-width:640px;margin:20px auto">
    <div style="display:flex;justify-content:center">${bot(passed?'happy':'sad')}</div>
    <h1 style="margin:0;color:${passed?'var(--good)':'var(--bad)'}">${passed?'🎉 ผ่านด่าน!':'😵 ยังไม่ผ่าน'}</h1>
    <div style="color:var(--muted)">${LEVELS[l].title}${reason?' · '+reason:''}</div>
    <div class="bigstars">${passed?'⭐'.repeat(st)+'☆'.repeat(3-st):'☆☆☆'}</div>
    <div style="font-family:Mitr;font-size:30px">🏆 ${G.score} คะแนน</div>
    ${passed?`<div class="legend">รวมโบนัสหัวใจที่เหลือ +${heartBonus}</div>`:''}
    <div class="stats"><div>ความแม่นยำ</div><div>${acc}% (ถูก ${s.correct} / ผิด ${s.wrong})</div>${extra}</div>
    ${unlocks}
    <hr style="border:none;border-top:1px dashed var(--line)">
    <div><b>${esc(p.name)}</b>${p.no?` · เลขที่ ${esc(p.no)}`:''} · ${CLASS_NAME}</div>
    <div class="legend">วิชา${SUBJECT} · ${dateTh}</div>
    <div class="row" style="justify-content:center;margin-top:14px">
      <button class="btn ghost" id="again">🔁 เล่นอีกครั้ง</button>
      ${hasNext?`<button class="btn" id="next">➡️ ด่านถัดไป</button>`:''}
      <button class="btn ghost" id="home">🏠 หน้าหลัก</button>
    </div>
  </div>`;
  $('#again').onclick=()=>startLevel(l);
  if($('#next')) $('#next').onclick=()=>startLevel(l+1);
  $('#home').onclick=showHome;
}

showHome();
</script>
<script type="module">
import { auth, db, onAuthStateChanged, doc, getDoc, isTeacherEmail, fullName } from "../js/common.js?v=5";
onAuthStateChanged(auth, async u => {
  if (!u) return location.replace("../index.html");
  if (isTeacherEmail(u.email)) return initPlayer(u.uid, "ครู (โหมดทดลอง)", "", true);
  try {
    const s = await getDoc(doc(db, "students", u.uid));
    const me = s.exists() ? s.data() : {};
    const name = fullName(me) + (me.nickname ? ` (${me.nickname})` : "");
    initPlayer(u.uid, name || "นักเรียน", me.no ?? "");
  } catch (e) {
    initPlayer(u.uid, "นักเรียน", "");
  }
});
</script>
</body>
</html>
