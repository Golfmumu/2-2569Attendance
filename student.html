<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หน้านักเรียน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>🎒 หน้านักเรียน</h1>
  <span class="who" id="who"></span>
  <button id="logout" class="sm">ออกจากระบบ</button>
</header>
<main>
  <div id="alerts"></div>
  <div class="tabs">
    <button data-tab="work" class="active">ภาระงาน</button>
    <button data-tab="scores">คะแนนของฉัน</button>
    <button data-tab="profile">ข้อมูลส่วนตัว</button>
    <button data-tab="group">กลุ่ม</button>
    <button data-tab="chq">คำถามท้ายบท</button>
  </div>
  <section id="tab-work"></section>
  <section id="tab-scores" class="hidden"></section>
  <section id="tab-group" class="hidden"><div class="card muted">กำลังโหลด…</div></section>
  <section id="tab-chq" class="hidden"><div class="card muted">กำลังโหลด…</div></section>
  <section id="tab-profile" class="hidden">
    <div class="card narrow" style="margin-top:0">
      <h2>ข้อมูลส่วนตัว</h2>
      <form id="pf">
        <div class="grid2">
          <div><label>รหัสนักเรียน</label><input id="pf_id" disabled></div>
          <div><label>เลขที่</label><input id="pf_no" type="number" min="1" max="99" required></div>
          <div><label>ชื่อจริง</label><input id="pf_fn" required></div>
          <div><label>นามสกุล</label><input id="pf_ln" required></div>
        </div>
        <label>ชื่อเล่น</label><input id="pf_nick" required>
        <label>รายวิชา / ห้องที่เรียน</label>
        <div class="checks" id="pf_sections"></div>
        <p><button type="submit">บันทึก</button></p>
      </form>
    </div>
    <div class="card narrow" id="lineCard">
      <h2>🔗 ผูกบัญชี LINE (สำหรับตอบคำถามจากบอท)</h2>
      <div id="lineState" class="muted">กำลังโหลด…</div>
      <div id="lineCodeBox" class="alert ok hidden" style="margin-top:10px"></div>
      <p class="row" style="margin-bottom:0">
        <button type="button" id="lineGetCode">ขอรหัสผูก LINE</button>
        <a class="btn ghost" id="lineAdd" target="_blank" rel="noopener">➕ เพิ่มเพื่อนบอท</a>
        <button type="button" class="ghost" id="lineCheck">ตรวจสถานะ</button>
      </p>
    </div>
  </section>
</main>

<script type="module">
import { auth, db, $, $$, esc, toast, thDate, thError, fullName, sectionLabel, SECTIONS, SLOT_COUNT, SLOT_MAX,
  DEFAULT_MIDTERM_MAX, STUDENT_EMAIL_DOMAIN, isTeacherEmail, randomToken, LINE_BOT_ID,
  onAuthStateChanged, signOut, doc, getDoc, getDocs, setDoc, collection, query, where, serverTimestamp, Timestamp,
  runTransaction, deleteField } from "./js/common.js?v=5";
import { CHAPTERS } from "./js/chapters.js?v=2";

$("#logout").onclick = () => signOut(auth).then(() => location.replace("index.html"));
$$(".tabs button").forEach(b => b.onclick = () => {
  $$(".tabs button").forEach(x => x.classList.toggle("active", x === b));
  ["work", "scores", "profile", "group", "chq"].forEach(t => $("#tab-" + t).classList.toggle("hidden", t !== b.dataset.tab));
});
$("#pf_sections").innerHTML = SECTIONS.map(s =>
  `<label><input type="checkbox" value="${esc(s.id)}"> ${esc(s.subject)} — ${esc(s.room)}</label>`).join("");

let user, me;

onAuthStateChanged(auth, async u => {
  if (!u) return location.replace("index.html");
  if (isTeacherEmail(u.email)) return location.replace("teacher.html");
  user = u;
  const snap = await getDoc(doc(db, "students", u.uid));
  me = snap.exists() ? snap.data() : null;
  fillProfile();
  loadLine();
  if (!me || !me.sections?.length) {
    $$(".tabs button")[2].click();
    $("#alerts").innerHTML = `<div class="alert warn">กรุณากรอกข้อมูลส่วนตัวและเลือกรายวิชาให้ครบก่อน</div>`;
    return;
  }
  $("#who").textContent = `${fullName(me)} (${me.nickname})`;
  loadAll();
});

function fillProfile() {
  $("#pf_id").value = me?.studentId || user.email.replace("@" + STUDENT_EMAIL_DOMAIN, "");
  $("#pf_no").value = me?.no ?? "";
  $("#pf_fn").value = me?.firstName ?? "";
  $("#pf_ln").value = me?.lastName ?? "";
  $("#pf_nick").value = me?.nickname ?? "";
  $$("#pf_sections input").forEach(i => i.checked = !!me?.sections?.includes(i.value));
}

$("#pf").onsubmit = async e => {
  e.preventDefault();
  const sections = $$("#pf_sections input:checked").map(i => i.value);
  if (!sections.length) return toast("เลือกรายวิชาอย่างน้อย 1 วิชา", "bad");
  const data = {
    studentId: $("#pf_id").value, no: Number($("#pf_no").value),
    firstName: $("#pf_fn").value.trim(), lastName: $("#pf_ln").value.trim(),
    nickname: $("#pf_nick").value.trim(), sections,
    createdAt: me?.createdAt || serverTimestamp(),
  };
  try {
    await setDoc(doc(db, "students", user.uid), data);
    me = data; toast("บันทึกแล้ว");
    $("#who").textContent = `${fullName(me)} (${me.nickname})`;
    $("#alerts").innerHTML = "";
    loadAll();
  } catch (err) { toast(thError(err), "bad"); }
};

async function loadAll() {
  const secIds = me.sections;
  const [scoreSnap, asgSnap, secDocs] = await Promise.all([
    getDocs(query(collection(db, "scores"), where("uid", "==", user.uid))),
    getDocs(query(collection(db, "assignments"), where("sectionId", "in", secIds))),
    Promise.all(secIds.map(id => getDoc(doc(db, "sections", id)))),
  ]);
  const scores = {};
  scoreSnap.forEach(d => scores[d.data().sectionId] = d.data());
  const secInfo = {};
  secDocs.forEach((d, i) => secInfo[secIds[i]] = d.exists() ? d.data() : {});
  const asgs = asgSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderScores(secIds, scores, secInfo);
  renderWork(asgs, scores);
  loadQuizScores(secIds);
  loadGroups();
  loadChapters();
}

/* ---------- คำถามท้ายบท ---------- */
async function loadChapters() {
  const list = CHAPTERS.filter(c => !c.sections || c.sections.some(id => me.sections.includes(id)));
  if (!list.length) { $("#tab-chq").innerHTML = `<div class="card muted">ยังไม่มีคำถามท้ายบท</div>`; return; }
  const scoreCards = [];
  const cards = await Promise.all(list.map(async c => {
    let a = null;
    try { const d = await getDoc(doc(db, "chapterAttempts", `${user.uid}_${c.id}`)); a = d.exists() ? d.data() : null; } catch (e) {}
    if (a) scoreCards.push(chapterScoreCard(c, a));
    const n = c.stages.reduce((t, s) => t + s.items.length, 0);
    let state, btn;
    if (!a) { state = `<span class="pill leave">ยังไม่ได้ทำ</span>`; btn = "เริ่มทำ"; }
    else if (a.status === "doing") { state = `<span class="pill late">ทำค้างไว้ · ออกจากหน้าแล้ว ${a.violations || 0}/${c.maxLeaves} ครั้ง</span>`; btn = "ทำต่อ"; }
    else {
      state = `<span class="pill ${a.status === "locked" ? "absent" : "present"}">${a.status === "locked" ? "ส่งอัตโนมัติ" : "ส่งแล้ว"} · ${a.score ?? 0}/${a.max ?? n} คะแนน · ${a.xp || 0} XP</span>`;
      btn = "ดูผล";
    }
    return `<div class="assign ${a ? (a.status === "doing" ? "soon" : "done") : "pending"}">
      <div class="t">${esc(c.title)} <span class="muted">· ${esc(c.subtitle || "")} · ${c.stages.length} ด่าน ${n} ข้อ</span></div>
      <div style="margin:8px 0">${state}</div>
      <a class="btn" href="chapter.html?ch=${encodeURIComponent(c.id)}">${btn}</a></div>`;
  }));
  $("#tab-chq").innerHTML = `<div class="card"><h2>📘 คำถามท้ายบท</h2>
    <p class="muted">เมื่อกดเข้าทำแล้ว ห้ามออกจากหน้า ห้ามสลับแอป และห้ามแคปหน้าจอ ระบบจะบันทึกให้ครูเห็นทุกครั้ง</p>${cards.join("")}</div>`;
  $$("#tab-scores .chqScore").forEach(el => el.remove());
  $("#tab-scores").insertAdjacentHTML("beforeend", scoreCards.join(""));
}

// การ์ดคะแนนคำถามท้ายบทในแท็บ "คะแนนของฉัน"
function chapterScoreCard(c, a) {
  const ans = a.answers || {};
  const rows = c.stages.map((s, i) => {
    const got = s.items.reduce((t, it) => t + (ans[it.id]?.p || 0), 0);
    const done = s.items.filter(it => ans[it.id]).length;
    return `<tr><td>${s.boss ? "ด่านบอส" : "ด่าน " + (i + 1)} · ${esc(s.name)}</td>
      <td class="num">${done ? got : "-"}</td><td class="num">${s.items.length}</td></tr>`;
  }).join("");
  const max = a.max ?? c.stages.reduce((t, s) => t + s.items.length, 0);
  const st = a.status === "doing" ? `<span class="pill late">ยังทำไม่เสร็จ</span>`
    : a.status === "locked" ? `<span class="pill absent">ส่งอัตโนมัติ (ออกจากหน้าครบ)</span>` : `<span class="pill present">ส่งแล้ว</span>`;
  return `<div class="card chqScore"><h2>📘 คะแนนคำถามท้ายบท — ${esc(c.title)} ${st}</h2>
    <div class="stats">
      <div class="stat present"><b>${a.score ?? 0}</b>คะแนน / ${max}</div>
      <div class="stat leave"><b>${a.xp || 0}</b>XP</div>
      <div class="stat ${a.violations ? "absent" : "present"}"><b>${a.violations || 0}</b>ออกจากหน้า (ครั้ง)</div>
    </div>
    <div class="table-wrap"><table><tr><th>ด่าน</th><th class="num">ได้</th><th class="num">เต็ม</th></tr>${rows}</table></div></div>`;
}

/* ---------- กลุ่ม ---------- */
const GROUP_MAX = 6, GROUP_MIN = 5;
const myLabel = () => `${me.no}. ${me.firstName} (${me.nickname})`;
const medal = i => ["🥇", "🥈", "🥉"][i] || `${i + 1}.`;

async function loadGroups() {
  const secIds = me.sections || [];
  let html = "";
  for (const sid of secIds) {
    try {
      const [gs, ws, qa, si] = await Promise.all([
        getDocs(query(collection(db, "groups"), where("sectionId", "==", sid))),
        getDocs(query(collection(db, "worksheets"), where("sectionId", "==", sid))),
        getDocs(query(collection(db, "quizAnswers"), where("sectionId", "==", sid), where("graded", "==", true))),
        getDoc(doc(db, "sections", sid)),
      ]);
      const groups = gs.docs.map(d => ({ id: d.id, ...d.data() }));
      const sheets = ws.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
      const pts = {};
      qa.forEach(d => { const a = d.data(); pts[a.uid] = (pts[a.uid] || 0) + (Number(a.points) || 0); });
      const locked = si.exists() && si.data().groupsLocked === true;
      html += renderSectionGroups(sid, groups, sheets, pts, locked);
    } catch (err) {
      html += `<div class="card"><h2>${esc(sectionLabel(sid))}</h2><p class="muted">ยังโหลดกลุ่มไม่ได้ (${esc(thError(err))}) — ให้แจ้งครู</p></div>`;
    }
  }
  $("#tab-group").innerHTML = html || `<div class="card muted">ยังไม่ได้เลือกรายวิชา</div>`;
  bindGroupButtons();
}

function groupTotals(g, sheets, pts) {
  const quiz = (g.members || []).reduce((t, u) => t + (pts[u] || 0), 0);
  const ws = sheets.reduce((t, w) => t + (Number(w.scores?.[g.id]) || 0), 0);
  return { quiz, ws, total: quiz + ws };
}

function renderSectionGroups(sid, groups, sheets, pts, locked) {
  const mine = groups.find(g => (g.members || []).includes(user.uid));
  const nm = (g, u) => esc(g.names?.[u] || "นักเรียน");
  let top = "";
  if (mine) {
    const t = groupTotals(mine, sheets, pts);
    top = `<div class="alert ok"><b>กลุ่มของฉัน: ${esc(mine.name)}</b> · ${mine.members.length}/${GROUP_MAX} คน · คะแนนกลุ่ม <b>${t.total}</b>
      <div style="margin-top:6px">${mine.members.map(u => `${nm(mine, u)} — ตอบคำถาม ${pts[u] || 0}`).join("<br>")}</div>
      ${mine.members.length < GROUP_MIN ? `<div style="margin-top:6px">⚠️ กลุ่มต้องมีอย่างน้อย ${GROUP_MIN} คน ชวนเพื่อนเข้ากลุ่มเพิ่มนะ</div>` : ""}
      ${locked ? "" : `<p style="margin:8px 0 0"><button class="sm danger gLeave" data-g="${mine.id}" data-s="${sid}">ออกจากกลุ่ม</button></p>`}</div>`;
  } else if (locked) {
    top = `<div class="alert warn">ครูล็อกการเลือกกลุ่มแล้ว คุณยังไม่มีกลุ่ม ให้แจ้งครู</div>`;
  } else {
    top = `<div class="alert warn">คุณยังไม่มีกลุ่ม — เลือกเข้าร่วมกลุ่มด้านล่าง หรือสร้างกลุ่มใหม่ (กลุ่มละ ${GROUP_MIN}–${GROUP_MAX} คน)</div>
      <div class="row" style="margin-bottom:12px"><div><label>ชื่อกลุ่มใหม่</label><input class="gName" data-s="${sid}" maxlength="40" placeholder="ตั้งชื่อกลุ่ม (เปลี่ยนภายหลังได้โดยครูเท่านั้น)"></div>
      <button class="gCreate" data-s="${sid}">➕ สร้างกลุ่ม</button></div>`;
  }
  const ranked = groups.map(g => ({ g, t: groupTotals(g, sheets, pts) }))
    .sort((a, b) => b.t.total - a.t.total || a.g.name.localeCompare(b.g.name, "th"));
  const rows = ranked.map(({ g, t }, i) => {
    const full = g.members.length >= GROUP_MAX, isMine = mine && mine.id === g.id;
    const join = !mine && !locked ? `<button class="sm gJoin" data-g="${g.id}" data-s="${sid}" ${full ? "disabled" : ""}>${full ? "เต็มแล้ว" : "เข้าร่วม"}</button>` : "";
    const sheetTxt = sheets.length ? sheets.map(w => `${esc(w.title)}: ${w.scores?.[g.id] ?? "-"}`).join(" · ") : "-";
    return `<tr${isMine ? ' style="background:var(--ok-soft)"' : ""}><td class="num">${medal(i)}</td>
      <td style="white-space:normal"><b>${esc(g.name)}</b>${isMine ? " (กลุ่มของฉัน)" : ""}<br>
        <span class="muted">${g.members.map(u => `${nm(g, u)} ${pts[u] || 0}`).join(", ")}</span></td>
      <td class="num">${g.members.length}/${GROUP_MAX}</td><td class="num">${t.quiz}</td>
      <td style="white-space:normal" class="muted">${sheetTxt}</td><td class="num"><b>${t.ws}</b></td><td class="num"><b>${t.total}</b></td><td>${join}</td></tr>`;
  }).join("");
  return `<div class="card"><h2>👥 กลุ่ม — ${esc(sectionLabel(sid))}${locked ? ' <span class="pill leave">ล็อกแล้ว</span>' : ""}</h2>${top}
    <h3>🏆 อันดับคะแนนกลุ่ม</h3>
    <p class="muted">คะแนนกลุ่ม = คะแนนตอบคำถามใน LINE ของสมาชิกทุกคนรวมกัน + คะแนนใบงานที่ครูให้</p>
    <div class="table-wrap"><table><tr><th class="num">อันดับ</th><th>กลุ่ม / สมาชิก (คะแนนตอบคำถาม)</th><th class="num">คน</th><th class="num">ตอบคำถาม</th><th>ใบงาน</th><th class="num">รวมใบงาน</th><th class="num">รวม</th><th></th></tr>
    ${rows || `<tr><td colspan="8" class="muted">ยังไม่มีกลุ่ม</td></tr>`}</table></div></div>`;
}

function bindGroupButtons() {
  $$("#tab-group .gCreate").forEach(b => b.onclick = () => createGroup(b, b.dataset.s));
  $$("#tab-group .gJoin").forEach(b => b.onclick = () => joinGroup(b, b.dataset.s, b.dataset.g));
  $$("#tab-group .gLeave").forEach(b => b.onclick = () => leaveGroup(b, b.dataset.s, b.dataset.g));
}

async function groupAction(btn, fn, okMsg) {
  btn.disabled = true;
  try { await fn(); toast(okMsg); }
  catch (err) { toast(err.userMsg || thError(err), "bad"); }
  btn.disabled = false;
  loadGroups();
}
const fail = msg => Object.assign(new Error(msg), { userMsg: msg });

function createGroup(btn, sid) {
  const name = $(`#tab-group .gName[data-s="${sid}"]`).value.trim();
  if (!name) return toast("ตั้งชื่อกลุ่มก่อน", "warn");
  groupAction(btn, async () => {
    const same = await getDocs(query(collection(db, "groups"), where("sectionId", "==", sid)));
    if (same.docs.some(d => d.data().name.trim().toLowerCase() === name.toLowerCase())) throw fail("ชื่อกลุ่มนี้มีแล้วในห้อง ลองชื่ออื่น");
    const gRef = doc(collection(db, "groups"));
    const mRef = doc(db, "groupMembers", `${sid}_${user.uid}`);
    await runTransaction(db, async tx => {
      if ((await tx.get(mRef)).exists()) throw fail("คุณมีกลุ่มอยู่แล้วในวิชานี้");
      tx.set(gRef, { sectionId: sid, name, members: [user.uid], names: { [user.uid]: myLabel() }, createdBy: user.uid, createdAt: serverTimestamp() });
      tx.set(mRef, { sectionId: sid, uid: user.uid, groupId: gRef.id });
    });
  }, `สร้างกลุ่ม "${name}" แล้ว ชวนเพื่อนกดเข้าร่วมได้เลย`);
}

function joinGroup(btn, sid, gid) {
  groupAction(btn, async () => {
    const gRef = doc(db, "groups", gid), mRef = doc(db, "groupMembers", `${sid}_${user.uid}`);
    await runTransaction(db, async tx => {
      const [g, m] = [await tx.get(gRef), await tx.get(mRef)];
      if (!g.exists()) throw fail("กลุ่มนี้ถูกลบไปแล้ว");
      if (m.exists()) throw fail("คุณมีกลุ่มอยู่แล้วในวิชานี้");
      const members = g.data().members || [];
      if (members.length >= GROUP_MAX) throw fail(`กลุ่มนี้ครบ ${GROUP_MAX} คนแล้ว`);
      tx.update(gRef, { members: [...members, user.uid], [`names.${user.uid}`]: myLabel() });
      tx.set(mRef, { sectionId: sid, uid: user.uid, groupId: gid });
    });
  }, "เข้าร่วมกลุ่มแล้ว");
}

function leaveGroup(btn, sid, gid) {
  if (!confirm("ออกจากกลุ่มนี้? คะแนนตอบคำถามของคุณจะไม่ถูกนับให้กลุ่มนี้แล้ว")) return;
  groupAction(btn, async () => {
    const gRef = doc(db, "groups", gid), mRef = doc(db, "groupMembers", `${sid}_${user.uid}`);
    await runTransaction(db, async tx => {
      const g = await tx.get(gRef);
      if (g.exists()) {
        const members = (g.data().members || []).filter(u => u !== user.uid);
        if (!members.length) tx.delete(gRef);
        else tx.update(gRef, { members, [`names.${user.uid}`]: deleteField() });
      }
      tx.delete(mRef);
    });
  }, "ออกจากกลุ่มแล้ว");
}

/* ---------- คะแนนตอบคำถาม ---------- */
const LET = ["ก", "ข", "ค", "ง"];
async function loadQuizScores(secIds) {
  let list = [];
  try {
    const snap = await getDocs(query(collection(db, "quizAnswers"), where("uid", "==", user.uid)));
    list = snap.docs.map(d => d.data()).sort((a, b) => (b.time?.toMillis?.() ?? 0) - (a.time?.toMillis?.() ?? 0));
  } catch (e) { return; }
  if (!list.length) return;
  const html = secIds.map(id => {
    const mine = list.filter(a => a.sectionId === id);
    if (!mine.length) return "";
    const total = mine.filter(a => a.graded).reduce((t, a) => t + (Number(a.points) || 0), 0);
    const right = mine.filter(a => a.correct).length;
    const rows = mine.map(a => `<tr><td style="white-space:normal">${esc(a.question)}</td><td>${thDate(a.time)}</td>
      <td>${!a.graded ? `<span class="pill leave">รอเฉลย</span>` : a.correct ? `<span class="pill present">✅ ถูก</span>`
        : `<span class="pill absent">❌ ผิด</span> <span class="muted">เฉลย ${LET[a.correctChoice] ?? ""}. ${esc(a.correctText || "")}</span>`}
        ${a.graded && a.explanation ? `<div class="muted" style="white-space:normal;margin-top:4px">💡 ${esc(a.explanation)}</div>` : ""}</td>
      <td class="num">${a.graded ? esc(a.points) : "-"}</td></tr>`).join("");
    return `<div class="card"><h2>❓ คะแนนตอบคำถาม — ${esc(sectionLabel(id))}</h2>
      <div class="stats"><div class="stat present"><b>${total}</b>คะแนนรวม</div><div class="stat leave"><b>${right}/${mine.length}</b>ตอบถูก (ข้อ)</div></div>
      <div class="table-wrap"><table><tr><th>คำถาม</th><th>วันที่</th><th>ผล</th><th class="num">คะแนน</th></tr>${rows}</table></div></div>`;
  }).join("");
  $("#tab-scores").insertAdjacentHTML("beforeend", html);
}

/* ---------- ผูกบัญชี LINE ---------- */
$("#lineAdd").href = `https://line.me/R/ti/p/${encodeURIComponent(LINE_BOT_ID)}`;
$("#lineCheck").onclick = () => loadLine(true);
async function loadLine(manual) {
  try {
    const d = await getDoc(doc(db, "lineLinks", user.uid));
    if (d.exists()) {
      $("#lineState").innerHTML = `✅ ผูกบัญชี LINE แล้ว${d.data().lineName ? ` (${esc(d.data().lineName)})` : ""} — ตอบคำถามในกลุ่มได้เลย`;
      $("#lineGetCode").textContent = "ผูกกับ LINE บัญชีอื่น";
      $("#lineCodeBox").classList.add("hidden");
    } else {
      $("#lineState").textContent = "ยังไม่ได้ผูกบัญชี LINE — ต้องผูกก่อนจึงจะตอบคำถามจากบอทได้";
      if (manual) toast("ยังไม่ได้ผูก ลองพิมพ์รหัสในแชทกับบอทอีกครั้ง", "warn");
    }
  } catch (e) { $("#lineState").textContent = "ยังเปิดใช้ไม่ได้ ให้แจ้งครู"; }
}
$("#lineGetCode").onclick = async () => {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  for (let tries = 0; tries < 3; tries++) {
    const a = new Uint8Array(6); crypto.getRandomValues(a);
    const code = [...a].map(b => chars[b % chars.length]).join("");
    try {
      await setDoc(doc(db, "lineLinkCodes", code), { uid: user.uid, expires: Timestamp.fromMillis(Date.now() + 10 * 60000) });
      $("#lineCodeBox").innerHTML = `1) กด "เพิ่มเพื่อนบอท" แล้วเปิดแชทกับบอท<br>
        2) พิมพ์ข้อความนี้ส่งให้บอท: <b style="font-size:1.3rem;letter-spacing:2px">เชื่อม ${code}</b>
        <button class="sm ghost" id="lineCopy" type="button">คัดลอก</button><br>
        <span class="muted">รหัสใช้ได้ 10 นาที · บอทตอบว่าผูกแล้ว ให้กด "ตรวจสถานะ"</span>`;
      $("#lineCodeBox").classList.remove("hidden");
      $("#lineCopy").onclick = async () => {
        try { await navigator.clipboard.writeText(`เชื่อม ${code}`); toast("คัดลอกแล้ว"); } catch (e) { prompt("คัดลอกข้อความนี้", `เชื่อม ${code}`); }
      };
      return;
    } catch (err) { if (tries === 2) toast(thError(err), "bad"); }
  }
};

function slotVal(sc, i) { const v = sc?.s?.[i]; return typeof v === "number" ? v : null; }

function renderScores(secIds, scores, secInfo) {
  $("#tab-scores").innerHTML = secIds.map(id => {
    const sc = scores[id], info = secInfo[id] || {};
    const names = info.slotNames || [];
    const mMax = info.midtermMax ?? DEFAULT_MIDTERM_MAX;
    let sum = 0;
    const cells = Array.from({ length: SLOT_COUNT }, (_, i) => {
      const v = slotVal(sc, i); if (v !== null) sum += v;
      return `<tr><td>${esc(names[i] || "ช่องที่ " + (i + 1))}</td><td class="num">${v ?? "-"}</td><td class="num">${SLOT_MAX}</td></tr>`;
    }).join("");
    const mid = typeof sc?.midterm === "number" ? sc.midterm : null;
    return `<div class="card"><h2>${esc(sectionLabel(id))}</h2>
      <div class="stats">
        <div class="stat present"><b>${sum}</b>คะแนนเก็บ / ${SLOT_COUNT * SLOT_MAX}</div>
        <div class="stat leave"><b>${mid ?? "-"}</b>กลางภาค / ${mMax}</div>
      </div>
      <div class="table-wrap"><table><tr><th>รายการ</th><th class="num">ได้</th><th class="num">เต็ม</th></tr>${cells}
      <tr><td>สอบกลางภาค</td><td class="num">${mid ?? "-"}</td><td class="num">${mMax}</td></tr></table></div></div>`;
  }).join("");
}

function renderWork(asgs, scores) {
  const now = Date.now(), DAY = 86400000;
  const items = asgs.map(a => {
    const due = a.due?.toDate ? a.due.toDate() : null;
    const done = a.slot !== null && a.slot !== undefined && slotVal(scores[a.sectionId], a.slot) !== null;
    let st = "pending";
    if (done) st = "done";
    else if (due && due.getTime() < now) st = "overdue";
    else if (due && due.getTime() - now < 2 * DAY) st = "soon";
    return { ...a, due, st };
  }).sort((x, y) => (x.due?.getTime() ?? 9e15) - (y.due?.getTime() ?? 9e15));

  const label = { done: "✅ ส่งแล้ว", overdue: "🔴 เลยกำหนดส่ง", soon: "🟠 ใกล้ครบกำหนด", pending: "🔵 ยังไม่ส่ง" };
  const overdue = items.filter(i => i.st === "overdue"), soon = items.filter(i => i.st === "soon");

  let alerts = "";
  if (overdue.length) alerts += `<div class="alert bad">🔴 มีงานเลยกำหนดส่ง <b>${overdue.length}</b> งาน: ${overdue.map(i => esc(i.title)).join(", ")} — รีบส่งด่วน!</div>`;
  if (soon.length) alerts += `<div class="alert warn">🟠 งานใกล้ครบกำหนด (ภายใน 2 วัน): ${soon.map(i => esc(i.title) + " (" + thDate(i.due, true) + ")").join(", ")}</div>`;
  $("#alerts").innerHTML = alerts;

  const open = items.filter(i => i.st !== "done"), done = items.filter(i => i.st === "done");
  const card = i => `<div class="assign ${i.st}">
      <div class="t">${esc(i.title)} <span class="muted">· ${esc(sectionLabel(i.sectionId))}</span></div>
      ${i.detail ? `<div style="white-space:pre-wrap;margin:6px 0">${esc(i.detail)}</div>` : ""}
      <div class="muted">กำหนดส่ง: ${i.due ? thDate(i.due, true) : "ไม่ระบุ"} · ${label[i.st]}</div></div>`;
  $("#tab-work").innerHTML = `
    <div class="card"><h2>งานที่ต้องส่ง (${open.length})</h2>${open.map(card).join("") || `<p class="muted">ไม่มีงานค้าง 🎉</p>`}
    <p class="no-print"><button class="ghost sm" id="notif">🔔 เปิดการแจ้งเตือนบนเครื่องนี้</button></p></div>
    <div class="card"><h2>ส่งแล้ว (${done.length})</h2>${done.map(card).join("") || `<p class="muted">-</p>`}</div>`;

  $("#notif").onclick = async () => {
    if (!("Notification" in window)) return toast("เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน", "warn");
    const p = await Notification.requestPermission();
    if (p === "granted") { toast("เปิดการแจ้งเตือนแล้ว"); notify(overdue, soon); }
  };
  notify(overdue, soon);
}

function notify(overdue, soon) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  if (!overdue.length && !soon.length) return;
  try {
    new Notification("📚 เตือนส่งการบ้าน", {
      body: [overdue.length ? `เลยกำหนด ${overdue.length} งาน` : "", soon.length ? `ใกล้ครบกำหนด ${soon.length} งาน` : ""].filter(Boolean).join(" · "),
    });
  } catch (e) {}
}
</script>
